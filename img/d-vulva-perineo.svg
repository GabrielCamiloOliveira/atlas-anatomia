  <g stroke="#8a4a40" stroke-width="2"><path d="M400,615 L400,622 M400,658 L400,665 M375,640 L382,640 M418,640 L425,640 M383,623 L388,628 M412,652 L417,657 M417,623 L412,628 M383,657 L388,652"/></g>
