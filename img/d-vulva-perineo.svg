  <ellipse cx="400" cy="360" rx="25" ry="44" fill="#7a3040"/>
  <g fill="#e8a0a0" stroke="#b86060" stroke-width="1">
    <circle cx="375" cy="345" r="5"/><circle cx="374" cy="372" r="5"/><circle cx="382" cy="396" r="4.5"/>
    <circle cx="425" cy="345" r="5"/><circle cx="426" cy="372" r="5"/><circle cx="418" cy="396" r="4.5"/>
    <circle cx="400" cy="404" r="4"/>
